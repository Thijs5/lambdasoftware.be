name: Deploy to KonsoleH + GitHub Pages (lambdasoftware.be)

# One-time setup: repo Settings -> Secrets and variables -> Actions.
#   Secrets:   SFTP_USERNAME, SFTP_PASSWORD
#   Variables: SFTP_HOST, SFTP_PORT, SFTP_REMOTE_PATH
#
# GitHub Pages also needs: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions" (one-time, one click).
#
# TEMPORARY dual-deploy during the move off KonsoleH: this pushes to both
# targets so DNS can be cut over to Pages with no downtime window. Once
# lambdasoftware.be's DNS points at GitHub Pages and HTTPS is confirmed
# working there, delete the SFTP step and the KonsoleH secrets/variables.
# See docs/adr/0004-migrate-hosting-to-github-pages.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Pinned to the exact @playwright/test version (package.json) so
    # screenshots render identically to the committed baseline in
    # e2e/**/*-snapshots/*-linux.png. Bump both together.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh baselines for the reviewed intro and browser update
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const name of ['homepage-chromium-win32.png', 'homepage-mobile-chromium-win32.png']) { const path = 'e2e/homepage.spec.ts-snapshots/' + name; fs.writeFileSync(path, Buffer.from(fs.readFileSync(path, 'utf8'), 'base64')); }"
          npm run test:e2e:update
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/homepage.spec.ts-snapshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Linux screenshots for the updated intro"
            git push origin HEAD:main
          fi

      - name: Run e2e visual regression tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build-and-deploy:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build with Astro
        run: npm run build

      - name: Deploy dist/ over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ vars.SFTP_HOST }}
          port: ${{ vars.SFTP_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: ${{ vars.SFTP_REMOTE_PATH }}
          sftp_only: true

      - name: Upload dist/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
